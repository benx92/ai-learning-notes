<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 670" role="img" aria-labelledby="title desc"><title id="title">重叠窗口保留完整片段</title><desc id="desc">块1含段落1和2，块2含2和3，块3含3和4。原文强边界后块4从段落5和6开始。</desc><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#e2e8f0} .title{font-size:27px;font-weight:700}.section{font-size:21px;font-weight:600}.label{font-size:18px}.small{font-size:16px;fill:#94a3b8}.axis{stroke:#64748b;stroke-width:1.5}.note{font-size:19px}</style><rect width="1100" height="670" fill="#0f172a"/><text x="35" y="45" class="title">文本块的重叠，是重复保留内容</text><text x="35" y="81" class="small">chunk_size=10字符，chunk_overlap=4字符；每个“段落N”长3字符，换行长1字符。</text><text x="42" y="151" class="label">原文第一组</text><rect x="250" y="118" width="150" height="52" rx="7" fill="#172033" stroke="#475569" stroke-width="2"/><text x="325" y="151" text-anchor="middle" class="label">段落1</text><rect x="425" y="118" width="150" height="52" rx="7" fill="#172033" stroke="#475569" stroke-width="2"/><text x="500" y="151" text-anchor="middle" class="label">段落2</text><rect x="600" y="118" width="150" height="52" rx="7" fill="#172033" stroke="#475569" stroke-width="2"/><text x="675" y="151" text-anchor="middle" class="label">段落3</text><rect x="775" y="118" width="150" height="52" rx="7" fill="#172033" stroke="#475569" stroke-width="2"/><text x="850" y="151" text-anchor="middle" class="label">段落4</text><text x="42" y="255" class="label">块1：长7字符</text><rect x="240" y="212" width="345" height="72" rx="11" fill="none" stroke="#22d3ee" stroke-width="2"/><rect x="250" y="222" width="150" height="52" rx="7" fill="#172033" stroke="#22d3ee" stroke-width="2"/><text x="325" y="255" text-anchor="middle" class="label">段落1</text><rect x="425" y="222" width="150" height="52" rx="7" fill="#172033" stroke="#22d3ee" stroke-width="2"/><text x="500" y="255" text-anchor="middle" class="label">段落2</text><path d="M500 278V297" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 4"/><text x="42" y="345" class="label">块2：长7字符</text><rect x="415" y="302" width="345" height="72" rx="11" fill="none" stroke="#a78bfa" stroke-width="2"/><rect x="425" y="312" width="150" height="52" rx="7" fill="#172033" stroke="#a78bfa" stroke-width="2"/><text x="500" y="345" text-anchor="middle" class="label">段落2</text><rect x="600" y="312" width="150" height="52" rx="7" fill="#172033" stroke="#a78bfa" stroke-width="2"/><text x="675" y="345" text-anchor="middle" class="label">段落3</text><path d="M675 368V387" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 4"/><text x="42" y="435" class="label">块3：长7字符</text><rect x="590" y="392" width="345" height="72" rx="11" fill="none" stroke="#34d399" stroke-width="2"/><rect x="600" y="402" width="150" height="52" rx="7" fill="#172033" stroke="#34d399" stroke-width="2"/><text x="675" y="435" text-anchor="middle" class="label">段落3</text><rect x="775" y="402" width="150" height="52" rx="7" fill="#172033" stroke="#34d399" stroke-width="2"/><text x="850" y="435" text-anchor="middle" class="label">段落4</text><path d="M35 500H1065" stroke="#64748b" stroke-dasharray="7 6"/><text x="42" y="532" class="small">原文空行分组：这里不强行复制“段落4”</text><text x="42" y="590" class="label">块4：第二组开始</text><rect x="250" y="558" width="150" height="52" rx="7" fill="#172033" stroke="#fbbf24" stroke-width="2"/><text x="325" y="591" text-anchor="middle" class="label">段落5</text><rect x="425" y="558" width="150" height="52" rx="7" fill="#172033" stroke="#fbbf24" stroke-width="2"/><text x="500" y="591" text-anchor="middle" class="label">段落6</text><text x="615" y="590" class="small">后续同理形成块5、块6</text><text x="42" y="640" class="small">本例实际重复一个3字符的完整段落；重叠目标4不等于每次都精确重复4字符。</text></svg>